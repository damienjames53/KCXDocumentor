name: Deploy Azure Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "azure-functions/kcxdocumentor-ai/**"
      - ".github/workflows/deploy-azure-function.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: kcxdocumentor-ai-dev
  cancel-in-progress: false

env:
  FUNCTION_APP_NAME: kcxdocumentor-ai-dev
  FUNCTION_PACKAGE_PATH: azure-functions/kcxdocumentor-ai
  NODE_VERSION: "22.x"

jobs:
  deploy:
    name: Build and deploy Function App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FUNCTION_PACKAGE_PATH }}/package-lock.json

      - name: Install Function dependencies
        working-directory: ${{ env.FUNCTION_PACKAGE_PATH }}
        run: npm ci --omit=dev

      - name: Validate Function syntax
        working-directory: ${{ env.FUNCTION_PACKAGE_PATH }}
        run: npm run test:syntax

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.FUNCTION_PACKAGE_PATH }}
