[project]
name = "kcxdocumentor"
version = "0.1.0"
description = "Prototype QA lane for token-aware workstation recording documentation."
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
visual-qa = [
    "pdf2image>=1.17.0",
    "Pillow>=12.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
